<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - TaskFlow</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }

    :root {
        --bg: #f7f7f8;
        --card-bg: #ffffff;
        --text: #1a1a1a;
        --text-muted: #6b7280;
        --border: #e5e7eb;
        --accent: #6366f1;
    }
    [data-theme="dark"] {
        --bg: #17181c;
        --card-bg: #24252b;
        --text: #f1f1f1;
        --text-muted: #9ca3af;
        --border: #33343a;
        --accent: #818cf8;
    }

    body {
        background: var(--bg); color: var(--text); min-height: 100vh;
        display:flex; align-items:center; justify-content:center;
    }

    .auth-card {
        background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
        padding: 36px 32px; width: 100%; max-width: 380px;
    }
    .auth-card h1 { font-size:1.4rem; margin-bottom:4px; }
    .auth-card .subtitle { color: var(--text-muted); font-size:0.85rem; margin-bottom:24px; }

    .flash { padding: 10px 14px; border-radius: 8px; font-size:0.85rem; margin-bottom:14px; }
    .flash.error { background:#fee2e2; color:#b91c1c; }
    .flash.success { background:#dcfce7; color:#166534; }
    .flash.info { background:#e0e7ff; color:#4c51bf; }

    label { display:block; font-size:0.8rem; color: var(--text-muted); margin-bottom:6px; }
    input[type=text], input[type=password], input[type=email] {
        width:100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
        font-size: 0.9rem; outline:none; background: var(--bg); color: var(--text);
        margin-bottom:16px;
    }
    input:focus { border-color: var(--accent); }

    button {
        width:100%; background: var(--accent); color:white; border:none; padding: 11px 20px;
        border-radius: 8px; font-size:0.95rem; cursor:pointer; font-weight:600;
    }
    button:hover { opacity:0.9; }

    .switch-link { text-align:center; margin-top:18px; font-size:0.85rem; color: var(--text-muted); }
    .switch-link a { color: var(--accent); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
    <div class="auth-card">
        <h1>🚀 Create your account</h1>
        <div class="subtitle">Start organizing your work with TaskFlow</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form action="/register" method="POST">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6">

            <button type="submit">Sign Up</button>
        </form>

        <div class="switch-link">
            Already have an account? <a href="/login">Log in</a>
        </div>
    </div>
</body>
</html>
